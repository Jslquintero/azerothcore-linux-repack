services:
  ac-worldserver:
    environment:

      ###########################################################################
      #  CORE SETTINGS
      ###########################################################################
      AC_PLAYER_LIMIT: "0"
      AC_CLOSE_IDLE_CONNECTIONS: "0"
      AC_WARDEN_ENABLED: "0"
      AC_EVENT_ANNOUNCE: "1"
      AC_EXPANSION: "2"
      AC_MAX_PLAYER_LEVEL: "80"
      AC_START_PLAYER_LEVEL: "1"
      AC_START_HEROIC_PLAYER_LEVEL: "55"
      AC_CHARACTER_CREATING_MIN_LEVEL_FOR_HEROIC_CHARACTER: "55"
      AC_DBC_ENFORCE_ITEM_ATTRIBUTES: "0"
      AC_ENABLE_PLAYER_SETTINGS: "1"

      ###########################################################################
      #  FAKE LOGIN QUEUE
      ###########################################################################
      AC_FAKE_QUEUE_MODE: "2"                 # 0=off, 1=always, 2=random
      AC_FAKE_QUEUE_CHANCE: "50"              # percent, used only by random mode
      AC_FAKE_QUEUE_DELAY: "600"            # milliseconds, capped at 300000
      AC_FAKE_QUEUE_APPLY_TO_SKIP_QUEUE: "1"  # also queue GM/admin/skip-queue accounts

      ###########################################################################
      #  PLAYERBOTS
      ###########################################################################
      AC_AI_PLAYERBOT_ENABLED: "1"
      AC_AI_PLAYERBOT_RANDOM_BOT_AUTOLOGIN: "1"
      AC_AI_PLAYERBOT_MIN_RANDOM_BOTS: "500"
      AC_AI_PLAYERBOT_MAX_RANDOM_BOTS: "500"
      AC_AI_PLAYERBOT_RANDOM_BOT_ACCOUNT_COUNT: "0"
      AC_AI_PLAYERBOT_DISABLED_WITHOUT_REAL_PLAYER: "0"
      AC_AI_PLAYERBOT_RANDOM_BOT_LOGIN_AT_STARTUP: "1"
      AC_AI_PLAYERBOT_DISABLE_DEATH_KNIGHT_LOGIN: "0"
      AC_AI_PLAYERBOT_RANDOM_BOT_UPDATE_INTERVAL: "10"
      AC_AI_PLAYERBOT_GLOBAL_COOLDOWN: "1500"
      AC_AI_PLAYERBOT_LIMIT_GEAR_EXPANSION: "1"
      AC_AI_PLAYERBOT_LIMIT_ENCHANT_EXPANSION: "1"
      AC_AI_PLAYERBOT_RANDOM_BOT_MIN_LEVEL: "1"
      AC_AI_PLAYERBOT_RANDOM_BOT_MAX_LEVEL: "80"
      AC_AI_PLAYERBOT_PROGRESSIVE_RANDOM_BOTS: "1"
      AC_AI_PLAYERBOT_PROGRESSIVE_RANDOM_BOTS_RESTRICT_RACES: "0"
      AC_AI_PLAYERBOT_PROGRESSIVE_RANDOM_BOTS_RESTRICT_CLASSES: "0"
      AC_AI_PLAYERBOT_MAX_ADDED_BOTS: "40"
      AC_AI_PLAYERBOT_ADD_CLASS_ACCOUNT_POOL_SIZE: "50"
      AC_AI_PLAYERBOT_SELF_BOT_LEVEL: "1"
      AC_AI_PLAYERBOT_BOT_CHEATS: "food"
      AC_AI_PLAYERBOT_RANDOM_GEAR_QUALITY_LIMIT: "3"
      AC_AI_PLAYERBOT_DISABLE_RANDOM_LEVELS: "1"
      AC_AI_PLAYERBOT_RANDOMBOT_STARTING_LEVEL: "1"
      AC_AI_PLAYERBOT_RANDOM_BOT_FIXED_LEVEL: "1"
      AC_AI_PLAYERBOT_RANDOM_BOT_XP_RATE: "0.0"
      AC_AI_PLAYERBOT_RANDOM_BOT_MIN_LEVEL_CHANCE: "1.0"
      AC_AI_PLAYERBOT_RANDOM_BOT_MAX_LEVEL_CHANCE: "0.0"
      AC_AI_PLAYERBOT_AUTO_UPGRADE_EQUIP: "0"
      AC_AI_PLAYERBOT_AUTO_TELEPORT_FOR_LEVEL: "0"
      AC_AI_PLAYERBOT_AUTO_DO_QUESTS: "0"
      AC_AI_PLAYERBOT_AUTO_LEARN_TRAINER_SPELLS: "0"
      AC_AI_PLAYERBOT_RANDOM_BOT_JOIN_BG: "0"
      AC_AI_PLAYERBOT_RANDOM_BOT_JOIN_LFG: "0"

      ###########################################################################
      #  PLAYER BOT LEVEL BRACKETS
      ###########################################################################
      AC_BOT_LEVEL_BRACKETS_ENABLED: "0"
      AC_BOT_LEVEL_BRACKETS_CHECK_FREQUENCY: "300"
      AC_BOT_LEVEL_BRACKETS_NUM_RANGES: "9"
      AC_BOT_LEVEL_BRACKETS_IGNORE_GUILD_BOTS_WITH_REAL_PLAYERS: "1"
      AC_BOT_LEVEL_BRACKETS_IGNORE_FRIEND_LISTED: "1"
      AC_BOT_LEVEL_BRACKETS_DYNAMIC_USE_DYNAMIC_DISTRIBUTION: "0"
      AC_BOT_LEVEL_BRACKETS_DYNAMIC_REAL_PLAYER_WEIGHT: "1.0"

      ###########################################################################
      #  INDIVIDUAL PROGRESSION
      ###########################################################################
      AC_INDIVIDUAL_PROGRESSION_ENABLE: "1"
      AC_INDIVIDUAL_PROGRESSION_ENFORCE_GROUP_RULES: "1"
      AC_INDIVIDUAL_PROGRESSION_VANILLA_POWER_ADJUSTMENT: "1"
      AC_INDIVIDUAL_PROGRESSION_VANILLA_HEALING_ADJUSTMENT: "1"
      AC_INDIVIDUAL_PROGRESSION_VANILLA_HEALTH_ADJUSTMENT: "1"
      AC_INDIVIDUAL_PROGRESSION_TBCPOWER_ADJUSTMENT: "1"
      AC_INDIVIDUAL_PROGRESSION_TBCHEALING_ADJUSTMENT: "1"
      AC_INDIVIDUAL_PROGRESSION_QUEST_XPFIX: "1"
      AC_INDIVIDUAL_PROGRESSION_PROGRESSION_LIMIT: "0"
      AC_INDIVIDUAL_PROGRESSION_STARTING_PROGRESSION: "0"
      AC_INDIVIDUAL_PROGRESSION_TBC_RACES_UNLOCK_PROGRESSION: "0"
      AC_INDIVIDUAL_PROGRESSION_DEATH_KNIGHT_UNLOCK_PROGRESSION: "0"
      AC_INDIVIDUAL_PROGRESSION_DEATH_KNIGHT_STARTING_PROGRESSION: "0"
      AC_INDIVIDUAL_PROGRESSION_DISABLE_RDF: "1"
      AC_INDIVIDUAL_PROGRESSION_SIMPLE_CONFIG_OVERRIDE: "1"
      AC_INDIVIDUAL_PROGRESSION_EXCLUDE_ACCOUNTS: "1"
      AC_INDIVIDUAL_PROGRESSION_EXCLUDED_ACCOUNTS_REGEX: "^RNDBOT.*"

      ###########################################################################
      #  AUTOBALANCE
      ###########################################################################
      AC_AUTO_BALANCE_ENABLE_GLOBAL: "1"
      AC_AUTO_BALANCE_ENABLE_5M: "1"
      AC_AUTO_BALANCE_ENABLE_10M: "1"
      AC_AUTO_BALANCE_ENABLE_25M: "1"
      AC_AUTO_BALANCE_ENABLE_40M: "1"
      AC_AUTO_BALANCE_MIN_PLAYERS: "1"
      AC_AUTO_BALANCE_MIN_PLAYERS_HEROIC: "1"
      AC_AUTO_BALANCE_MIN_PLAYERS_RAID: "1"
      AC_AUTO_BALANCE_INFLECTION_POINT: "0.5"
      AC_AUTO_BALANCE_INFLECTION_POINT_RAID: "0.5"
      AC_AUTO_BALANCE_LEVEL_SCALING: "1"
      AC_AUTO_BALANCE_LEVEL_SCALING_METHOD: "dynamic"
      AC_AUTO_BALANCE_PLAYER_COUNT_DIFFICULTY_OFFSET: "0"
      AC_AUTO_BALANCE_REWARD_SCALING_XP: "1"
      AC_AUTO_BALANCE_REWARD_SCALING_MONEY: "1"

      ###########################################################################
      #  AUCTION HOUSE BOT
      ###########################################################################
      AC_AUCTION_HOUSE_BOT_ENABLE_SELLER: "1"
      AC_AUCTION_HOUSE_BOT_ENABLE_BUYER: "1"
      AC_AUCTION_HOUSE_BOT_ACCOUNT: "0"
      AC_AUCTION_HOUSE_BOT_GUID: "0"
      AC_AUCTION_HOUSE_BOT_ITEMS_PER_CYCLE: "200"
      AC_AUCTION_HOUSE_BOT_CONSIDER_ONLY_BOT_AUCTIONS: "0"
      AC_AUCTION_HOUSE_BOT_LOOT_ITEMS: "1"
      AC_AUCTION_HOUSE_BOT_LOOT_TRADE_GOODS: "1"
      AC_AUCTION_HOUSE_BOT_BIND_WHEN_EQUIPPED: "1"
      AC_AUCTION_HOUSE_BOT_ELAPSING_TIME_CLASS: "1"

      ###########################################################################
      #  TRANSMOG
      ###########################################################################
      AC_TRANSMOGRIFICATION_ENABLE: "1"
      AC_TRANSMOGRIFICATION_ENABLE_SORT_BY_QUALITY_AND_NAME: "1"
      AC_TRANSMOGRIFICATION_USE_COLLECTION_SYSTEM: "1"
      AC_TRANSMOGRIFICATION_USE_VENDOR_INTERFACE: "0"
      AC_TRANSMOGRIFICATION_ALLOW_HIDDEN_TRANSMOG: "1"
      AC_TRANSMOGRIFICATION_ALLOW_MIXED_ARMOR_TYPES: "0"
      AC_TRANSMOGRIFICATION_ALLOW_MIXED_WEAPON_TYPES: "0"
      AC_TRANSMOGRIFICATION_ALLOW_LEGENDARY: "0"
      AC_TRANSMOGRIFICATION_SCALED_COST_MODIFIER: "1.0"
      AC_TRANSMOGRIFICATION_ENABLE_SETS: "1"
      AC_TRANSMOGRIFICATION_MAX_SETS: "10"

      ###########################################################################
      #  LEARN SPELLS
      ###########################################################################
      AC_LEARN_SPELLS_ENABLE: "1"
      AC_LEARN_SPELLS_ON_FIRST_LOGIN: "0"
      AC_LEARN_SPELLS_MAX_LEVEL: "80"

      ###########################################################################
      #  AOE LOOT
      ###########################################################################
      AC_AOELOOT_ENABLE: "1"
      AC_AOELOOT_RANGE: "55.0"
      AC_AOELOOT_GROUP: "1"

      ###########################################################################
      #  ACCOUNT ACHIEVEMENTS
      ###########################################################################
      AC_ACCOUNT_ACHIEVEMENTS_ENABLE: "1"
      AC_ACCOUNT_ACHIEVEMENTS_EXCLUDED: "0"

      ###########################################################################
      #  ACCOUNT MOUNTS
      ###########################################################################
      AC_ACCOUNT_MOUNTS_ENABLE: "1"
      AC_ACCOUNT_MOUNTS_LIMIT_RACE: "0"

      ###########################################################################
      #  LEECH
      ###########################################################################
      AC_LEECH_ENABLE: "1"
      AC_LEECH_DUNGEONS_ONLY: "0"
      AC_LEECH_AMOUNT: "0.05"
      AC_LEECH_REQUIRED_ITEM_ID: "0"

      ###########################################################################
      #  NO HEARTHSTONE COOLDOWN
      ###########################################################################
      AC_NO_HEARTHSTONE_COOLDOWN_ENABLE: "1"

      ###########################################################################
      #  REAGENT BANK
      ###########################################################################
      AC_REAGENT_BANK_ENABLE: "1"

      ###########################################################################
      #  TIME IS TIME
      ###########################################################################
      AC_TIME_IS_TIME_ENABLE: "1"
      AC_TIME_IS_TIME_SPEED_RATE: "30.0"
      AC_TIME_IS_TIME_TIME_START: "0"
      AC_TIME_IS_TIME_HOUR_OFFSET: "0.0"

    volumes:
      - ./modules:/azerothcore/modules:ro,z
